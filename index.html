<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Баскетбольные кроссовки US W9</title>
<style>
  :root{
    --bg:#f6f3f1; --surface:#fffdfc; --surface-2:#eee8e5;
    --ink:#1d1a1b; --ink-soft:#574f52; --ink-faint:#8c8386;
    --line:#ddd4d6; --line-soft:#e9e2e3;
    --accent:#b8245f; --accent-ink:#fff8fb; --accent-soft:rgba(184,36,95,.10);
    --good:#2f7a50; --good-soft:rgba(47,122,80,.12);
    --warn:#8f6a14; --warn-soft:rgba(176,132,30,.14);
    --star:#c08a1e;
    --shadow:0 1px 2px rgba(29,26,27,.05),0 8px 24px rgba(29,26,27,.07);
    --radius:16px; --radius-sm:10px;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
    --maxw:1180px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#121011; --surface:#1b1819; --surface-2:#262123;
      --ink:#efe8ea; --ink-soft:#b8acb0; --ink-faint:#7f7478;
      --line:#372f32; --line-soft:#2b2527;
      --accent:#ff79ab; --accent-ink:#1d0f15; --accent-soft:rgba(255,121,171,.14);
      --good:#74c08f; --good-soft:rgba(116,192,143,.14);
      --warn:#d8b25a; --warn-soft:rgba(216,178,90,.14);
      --star:#e3b552;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121011; --surface:#1b1819; --surface-2:#262123;
    --ink:#efe8ea; --ink-soft:#b8acb0; --ink-faint:#7f7478;
    --line:#372f32; --line-soft:#2b2527;
    --accent:#ff79ab; --accent-ink:#1d0f15; --accent-soft:rgba(255,121,171,.14);
    --good:#74c08f; --good-soft:rgba(116,192,143,.14);
    --warn:#d8b25a; --warn-soft:rgba(216,178,90,.14);
    --star:#e3b552;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
  header.top{padding:34px 0 10px}
  .eyebrow{font-size:.85rem;color:var(--ink-faint)}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.8rem,4.2vw,2.7rem);line-height:1.12;margin:6px 0 10px}
  .lead{color:var(--ink-soft);max-width:800px;margin:0}
  .theme-btn{position:fixed;top:12px;right:12px;z-index:5;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:999px;width:44px;height:44px;cursor:pointer;font-size:1.1rem}
  .sizes{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0 2px}
  .sizes th,.sizes td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft)}
  .sizes th{color:var(--ink-faint);font-weight:600}
  .tablewrap{overflow-x:auto}
  .tabs{display:flex;gap:6px;margin:22px 0 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tab{appearance:none;border:0;background:none;padding:12px 14px;min-height:44px;font:inherit;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .tab .n{font-weight:500;color:var(--ink-faint);font-size:.85rem;margin-left:4px}
  .controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:14px 0}
  .controls label{font-size:.88rem;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
  select,input[type=search]{font:inherit;font-size:.9rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;min-height:44px}
  input[type=search]{flex:1 1 200px;min-width:0}
  input[type=range]{accent-color:var(--accent);width:140px}
  .chipset{display:flex;gap:6px;flex-wrap:wrap}
  .chip-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:6px 12px;min-height:36px;font:inherit;font-size:.85rem;cursor:pointer}
  .chip-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .count{font-size:.85rem;color:var(--ink-faint);margin-left:auto}
  .list{display:grid;gap:14px;padding-bottom:20px}
  .card{display:grid;grid-template-columns:56px 170px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);align-items:start}
  .rank{font-family:var(--serif);font-size:2rem;font-weight:600;color:var(--ink-faint);text-align:center;line-height:1}
  .rank small{display:block;font-family:var(--sans);font-size:.72rem;margin-top:6px;color:var(--ink-faint)}
  .ph{width:170px;height:170px;border-radius:var(--radius-sm);background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:2.4rem;border:1px solid var(--line-soft)}
  .ph img{width:100%;height:100%;object-fit:contain;display:block}
  .body h3{margin:0;font-size:1.08rem;line-height:1.3}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .tag{font-size:.78rem;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
  .tag.src{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .tag.good{background:var(--good-soft);color:var(--good)}
  .tag.warn{background:var(--warn-soft);color:var(--warn)}
  .price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 6px}
  .price b{font-size:1.35rem}
  .price s{color:var(--ink-faint)}
  .why{color:var(--ink-soft);font-size:.93rem;margin:6px 0 10px}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px;font-size:.86rem;color:var(--ink-soft);margin-bottom:10px}
  .facts span{color:var(--ink-faint)}
  .scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 14px;margin-bottom:12px}
  .sc{font-size:.78rem;color:var(--ink-faint)}
  .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--radius-sm);font-weight:600;font-size:.92rem;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.fav[aria-pressed="true"]{color:var(--star);border-color:var(--star)}
  .where{font-size:.86rem;color:var(--ink-soft);margin:0 0 10px}
  .where a{margin-right:10px}
  .empty{padding:30px;text-align:center;color:var(--ink-faint)}
  section.guide{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px 20px;margin:10px 0 24px;box-shadow:var(--shadow)}
  section.guide h2{font-family:var(--serif);font-weight:600;margin:0 0 8px;font-size:1.3rem}
  section.guide ul{margin:0;padding-left:20px;color:var(--ink-soft)}
  section.guide li{margin:4px 0}
  details.rej{margin:0 0 24px;color:var(--ink-soft);font-size:.9rem}
  details.rej summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
  details.rej li{margin:3px 0}
  footer{color:var(--ink-faint);font-size:.82rem;padding:10px 0 40px}
  [hidden]{display:none !important}
  @media (max-width:680px){
    .card{grid-template-columns:1fr 110px;gap:10px 12px}
    .rank{grid-column:1;grid-row:1;text-align:left;font-size:1.5rem}
    .rank small{display:inline;margin-left:8px}
    .ph{grid-column:2;grid-row:1 / span 2;width:110px;height:110px}
    .body{grid-column:1 / -1}
    .count{margin-left:0;width:100%}
  }
</style>

</div>

const $ = s => document.querySelector(s);
const fmt = n => n ? n.toLocaleString('uk-UA') : '—';
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
(function theme(){
  const root = document.documentElement;
  let t = null; try{ t = localStorage.getItem('ibook-theme'); }catch(e){}
  if (t) root.dataset.theme = t;
  $('#themeBtn').onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try{ localStorage.setItem('ibook-theme', root.dataset.theme); }catch(e){}
  };
})();

const favs = new Set(store.get('bball-favs', []));
const state = { tab: store.get('bball-tab', DATA.tabs[0].id), q:'', sort:'rank', max:0, brand:'all', brightOnly:false, favOnly:false };
if (!DATA.tabs.some(t => t.id === state.tab)) state.tab = DATA.tabs[0].id;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('#eyebrow').textContent = DATA.meta.eyebrow;
$('#lead').textContent = DATA.meta.lead;
$('#foot').textContent = DATA.meta.footer;
$('#guide').innerHTML = DATA.guide.map(g => '<li>' + g + '</li>').join('');
$('#sizes').innerHTML = '<tr>' + DATA.sizes.head.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr>' + DATA.sizes.rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('');

$('#tabs').innerHTML = DATA.tabs.map(t => '<button class="tab" role="tab" data-id="' + t.id + '">' + esc(t.title) + '<span class="n">' + t.items.length + '</span></button>').join('');
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.tab = b.dataset.id; store.set('bball-tab', state.tab); state.max = 0; state.brand = 'all'; render(); });
$('#q').oninput = e => { state.q = e.target.value.toLowerCase(); render(); };
$('#sort').onchange = e => { state.sort = e.target.value; render(); };
$('#max').oninput = e => { state.max = +e.target.value; render(); };
$('#brightOnly').onclick = e => { state.brightOnly = !state.brightOnly; e.target.setAttribute('aria-pressed', state.brightOnly); render(); };
$('#favOnly').onclick = e => { state.favOnly = !state.favOnly; e.target.setAttribute('aria-pressed', state.favOnly); render(); };

function bar(label, v){ return '<div class="sc">' + label + ' · ' + v + '/10<div class="bar"><i style="width:' + (v*10) + '%"></i></div></div>'; }
function favBtn(key){ const f = favs.has(key); return '<button class="btn fav" data-fav="' + esc(key) + '" aria-pressed="' + f + '">' + (f ? '★ в избранном' : '☆ в избранное') + '</button>'; }

function card(it){
  const old = it.old_price_uah && it.old_price_uah > it.price_uah ? '<s>' + fmt(it.old_price_uah) + ' ₴</s>' : '';
  const tags = ['<span class="tag src">' + esc(it.source) + '</span>'];
  if (it.condition) tags.push('<span class="tag ' + (/^нов/i.test(it.condition) ? 'good' : 'warn') + '">' + esc(it.condition) + '</span>');
  if (it.location) tags.push('<span class="tag">📍 ' + esc(it.location) + '</span>');
  const img = it.img ? '<img loading="lazy" src="' + it.img + '" alt="">' : '👟';
  return '<article class="card">'
    + '<div class="rank">' + it.rank + '<small>' + esc(it.badge || '') + '</small></div>'
    + '<div class="ph">' + img + '</div>'
    + '<div class="body"><h3>' + esc(it.title) + '</h3>'
    + '<div class="price"><b>' + fmt(it.price_uah) + ' ₴</b>' + old + '</div>'
    + '<div class="meta">' + tags.join('') + '</div>'
    + '<p class="why">' + esc(it.why) + '</p>'
    + '<div class="facts"><div><span>Модель:</span> ' + esc(it.model) + '</div><div><span>Расцветка:</span> ' + esc(it.colorway) + '</div><div><span>Ваш размер:</span> ' + esc(it.target_size) + '</div><div><span>В наличии:</span> ' + esc(it.sizes_in_stock) + '</div>' + (it.seller_signal ? '<div><span>Продавец:</span> ' + esc(it.seller_signal) + '</div>' : '') + '</div>'
    + '<div class="scores">' + bar('Качество', it.quality) + bar('Интерес', it.interest) + bar('Яркость', it.bright) + bar('Цена/качество', it.value) + '</div>'
    + '<div class="actions"><a class="btn primary" href="' + esc(it.url) + '" target="_blank" rel="noopener">Открыть ↗</a>' + favBtn(it.url) + '</div>'
    + '</div></article>';
}

function modelCard(m){
  const img = m.img ? '<img loading="lazy" src="' + m.img + '" alt="">' : '👟';
  const where = (m.where || []).map(w => '<a href="' + esc(w.url) + '" target="_blank" rel="noopener">' + esc(w.label) + '</a>').join('');
  const reviews = (m.reviews || []).map((u, i) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">обзор ' + (i + 1) + '</a>').join('');
  return '<article class="card">'
    + '<div class="rank">' + m.rank + '<small>' + esc(m.badge || '') + '</small></div>'
    + '<div class="ph">' + img + '</div>'
    + '<div class="body"><h3>' + esc(m.model) + '</h3>'
    + '<div class="price"><b>' + esc(m.price) + '</b></div>'
    + '<div class="meta"><span class="tag src">' + esc(m.brand) + '</span><span class="tag">' + esc(m.tier) + '</span></div>'
    + '<p class="why">' + esc(m.why) + '</p>'
    + '<div class="facts"><div><span>Размер под W9:</span> ' + esc(m.size) + '</div><div><span>Посадка:</span> ' + esc(m.fit) + '</div><div><span>Технологии:</span> ' + esc(m.tech) + '</div><div><span>Яркие цвета:</span> ' + esc(m.colors) + '</div><div><span>Минусы:</span> ' + esc(m.cons) + '</div></div>'
    + '<div class="scores">' + bar('Качество', m.quality) + bar('Интерес', m.interest) + '</div>'
    + (where ? '<p class="where"><span style="color:var(--ink-faint)">Где сейчас купить:</span> ' + where + '</p>' : '')
    + (reviews ? '<p class="where"><span style="color:var(--ink-faint)">Обзоры:</span> ' + reviews + '</p>' : '')
    + '<div class="actions">' + favBtn('model:' + m.model) + '</div>'
    + '</div></article>';
}

function render(){
  const tab = DATA.tabs.find(t => t.id === state.tab);
  const isModels = tab.kind === 'models';
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.id === state.tab));
  ['#maxWrap', '#brightOnly', '#sort'].forEach(s => { const el = $(s); (s === '#sort' ? el.parentElement : el).hidden = isModels; });
  const brands = ['all', ...new Set(tab.items.map(i => i.brand))];
  $('#brands').innerHTML = brands.map(b => '<button class="chip-btn" data-b="' + esc(b) + '" aria-pressed="' + (b === state.brand) + '">' + (b === 'all' ? 'все бренды' : esc(b)) + '</button>').join('');
  document.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { state.brand = b.dataset.b; render(); });
  let items;
  if (isModels) {
    items = tab.items.filter(m => (state.brand === 'all' || m.brand === state.brand) && (!state.favOnly || favs.has('model:' + m.model)) &&
      (!state.q || (m.model + ' ' + m.brand + ' ' + m.colors + ' ' + m.why).toLowerCase().includes(state.q)));
    $('#list').innerHTML = items.length ? items.map(modelCard).join('') : '<div class="empty">Под фильтры ничего не подошло</div>';
  } else {
    const top = Math.ceil(Math.max(...tab.items.map(i => i.price_uah)) / 100) * 100;
    const r = $('#max'); r.max = top; if (!state.max || state.max > top) state.max = top; r.value = state.max; $('#maxOut').textContent = fmt(state.max);
    items = tab.items.filter(i =>
      i.price_uah <= state.max &&
      (state.brand === 'all' || i.brand === state.brand) &&
      (!state.brightOnly || i.bright >= 7) &&
      (!state.favOnly || favs.has(i.url)) &&
      (!state.q || (i.title + ' ' + i.model + ' ' + i.colorway + ' ' + i.source + ' ' + i.location).toLowerCase().includes(state.q)));
    const by = { rank:(a,b)=>a.rank-b.rank, price:(a,b)=>a.price_uah-b.price_uah, '-price':(a,b)=>b.price_uah-a.price_uah, quality:(a,b)=>b.quality-a.quality||a.rank-b.rank, bright:(a,b)=>b.bright-a.bright||a.rank-b.rank, value:(a,b)=>b.value-a.value||a.rank-b.rank }[state.sort];
    items = items.slice().sort(by);
    $('#list').innerHTML = items.length ? items.map(card).join('') : '<div class="empty">Под фильтры ничего не подошло</div>';
  }
  $('#count').textContent = 'показано ' + items.length + ' из ' + tab.items.length;
  document.querySelectorAll('[data-fav]').forEach(b => b.onclick = () => {
    const u = b.dataset.fav; favs.has(u) ? favs.delete(u) : favs.add(u); store.set('bball-favs', [...favs]); render();
  });
  const rej = tab.rejected || [];
  $('#rejBox').hidden = !rej.length;
  $('#rejSum').textContent = 'Отсеяно при проверке: ' + rej.length;
  $('#rejList').innerHTML = rej.map(x => '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title) + '</a> — ' + esc(x.reason) + '</li>').join('');
}
render();
</script>
</body>
</html>
